<!doctype html>
<html>
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una aplicación en la que podrás crear y explotar globos, cambiar borrosidad, tamaño y color de forma interactiva."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Animación globos · Antonio M." />
    <meta
      property="og:description"
      content="Una apliacación para divertirte creando y eliminando globos de forma interactiva con un centro de control."
    />
    <meta
      property="og:url"
      content="https://antoniomuda.github.io/portfolio/animacion.html"
    />
    <meta
      property="og:image"
      content="https://antoniomuda.github.io/portfolio/assets/img/og-animacion.png"
    />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Animación globos · Antonio M.</title>
  
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/tester.css" />
    <link rel="stylesheet" href="css/animacion.css">
    <script defer src="js/script.js"></script>
  
  </head>
  <body>
    <div id="wrap">

      <canvas id="c"></canvas>
      <div id="blur-layer"></div>
    </div>
  <a href="laboratorio.html">← Laboratorio</a>
     <div class="consulta">
          <div class="controles">
            <div>
              <label for="fuente">Cambia color</label>
              <select name="color" id="color">
                <option value="red" selected>Rojo</option>
                <option value="yellow">Amarillo</option>
                <option value="pink">Rosa</option>
                <option value="blue">Azul</option>
                <option value="black">Negro</option>
                <option value="green">Verde</option>
              </select>
            </div>
            <div>
              <label for="tamano">Tamaño</label>
              <input type="range" id="tamano" min="16" max="240" value="150" />
              <p class="valor">
                <output id="valor-tamano" for="tamano">150</output> px
              </p>
            </div>
            <div>
              <label for="grosor">Borrosidad</label>
              <input
                type="range"
                id="borrosidad"
                min="100"
                max="900"
                step="100"
                value="400"
              />
              <p class="valor">
                <output id="valor-borrosidad" for="borrosidad">400</output>
              </p>
            </div>

                <div>
             
              <button class="boton-principal" type="button" id="explota" >Explota globos</button>

            </div>
                <div>
            
              <button class="boton-principal" type="button" id="anade">Añade globos</button>
            
            </div>
            <div>
              <button type="button" id="reiniciar">Reiniciar</button>
            </div>
          </div>



    <script src="js/animacion.js"></script>
  </body>
</html>
